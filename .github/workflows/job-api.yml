name: Shared job API
on: [push, pull_request]
jobs:
  native-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and lint job layer
        run: |
          cargo fmt -p optimization-job-api -p optimization-runner -p fcmaes-job-worker -- --check
          cargo clippy --locked -p optimization-job-api -p optimization-runner -p fcmaes-job-worker --all-targets -- -D warnings
      - name: Contract tests and native build
        run: |
          cargo test --release --locked -p optimization-job-api -p optimization-runner -p fcmaes-job-worker
          cargo build --release --locked -p optimization-runner -p fcmaes-job-worker
      - name: Lifecycle and numerical integration
        run: python3 scripts/job-api/test_integration.py
      - name: Runnable tutorial
        run: python3 tutorials/job-api/run.py --root "$RUNNER_TEMP/job-api-tutorial"
