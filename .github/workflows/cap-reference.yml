name: Validated numerics reference

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tutorials/validated-numerics/**'
      - '.github/workflows/cap-reference.yml'
  push:
    branches: [main]
    paths:
      - 'tutorials/validated-numerics/**'
      - '.github/workflows/cap-reference.yml'

permissions:
  contents: read

concurrency:
  group: cap-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Validated numerics reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JULIA_PKG_USE_CLI_GIT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Check and build the bounded Rust search application
        run: |
          cargo fmt --manifest-path tutorials/validated-numerics/search/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tutorials/validated-numerics/search/Cargo.toml --all-targets -- -D warnings
          cargo test --release --locked --manifest-path tutorials/validated-numerics/search/Cargo.toml
          cargo build --release --locked --manifest-path tutorials/validated-numerics/search/Cargo.toml
      - name: Recheck the retained certificates in exact rational arithmetic
        run: python tutorials/validated-numerics/exact_check.py
      - name: Instantiate exact Julia environment and run proof regressions
        shell: bash
        run: |
          export JULIA_DEPOT_PATH="$RUNNER_TEMP/cap-depot"
          echo "JULIA_DEPOT_PATH=$JULIA_DEPOT_PATH" >> "$GITHUB_ENV"
          julia --startup-file=no --project=tutorials/validated-numerics/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test(;allow_reresolve=false)' \
            2>&1 | tee "$RUNNER_TEMP/julia-tests.log"
      - name: Build the command runtime and fetch the campaign client
        run: |
          python -m pip install 'jsonschema>=4.18,<5'
          git clone https://github.com/dietmarwo/optimization-jobs "$RUNNER_TEMP/optimization-jobs"
          git -C "$RUNNER_TEMP/optimization-jobs" checkout --detach 051435c325a51cc89be4ae26645d6937eed6f5e5
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/optimization-jobs/Cargo.toml" -p optimization-runner --bin optimization-run
          git clone https://github.com/dietmarwo/experiment-craft "$RUNNER_TEMP/experiment-craft"
          git -C "$RUNNER_TEMP/experiment-craft" checkout --detach 013077b37e917d994d3346aa0c1a36c5dfe6fec2
      - name: Fresh-process replay, retained evidence and real foreground command campaigns
        run: |
          python tutorials/validated-numerics/test_workflow.py \
            --julia "$(command -v julia)" --depot "$JULIA_DEPOT_PATH" \
            --runner "$RUNNER_TEMP/optimization-jobs/target/release/optimization-run" \
            --experiment-craft-source "$RUNNER_TEMP/experiment-craft" \
            --output "$RUNNER_TEMP/cap-evidence"
      - name: Frozen search comparisons, fresh proof replay and lifecycle regressions
        run: |
          python tutorials/validated-numerics/test_search.py \
            --binary tutorials/validated-numerics/search/target/release/cap-search \
            --julia "$(command -v julia)" --depot "$JULIA_DEPOT_PATH" \
            --runner "$RUNNER_TEMP/optimization-jobs/target/release/optimization-run" \
            --experiment-craft-source "$RUNNER_TEMP/experiment-craft" \
            --output "$RUNNER_TEMP/cap-search-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-reference-evidence
          path: |
            ${{ runner.temp }}/cap-search-evidence
            ${{ runner.temp }}/cap-evidence
            ${{ runner.temp }}/julia-tests.log
          if-no-files-found: ignore
