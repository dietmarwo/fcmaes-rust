name: Publish fcmaes-core

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fcmaes-core") | .version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Validate formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy -p fcmaes-core --all-targets -- -D warnings
      - name: Run tests
        run: cargo test -p fcmaes-core --locked
      - name: Verify package
        run: cargo publish -p fcmaes-core --dry-run --locked
      - name: Explain first-release bootstrap
        if: vars.CRATES_IO_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "Validation passed. Upload skipped until the crate exists,"
          echo "its Trusted Publisher is configured, and the repository"
          echo "variable CRATES_IO_TRUSTED_PUBLISHING is set to true."
      - name: Obtain a short-lived crates.io token
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && startsWith(github.ref, 'refs/tags/')
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish fcmaes-core
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && startsWith(github.ref, 'refs/tags/')
        run: cargo publish -p fcmaes-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
