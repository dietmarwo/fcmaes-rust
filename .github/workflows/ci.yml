name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - name: Check locked workspace on the declared MSRV
        run: cargo check --workspace --locked

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: Python binding tests
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "maturin[patchelf]>=1.7,<2" numpy scipy pytest
          env -u CONDA_PREFIX VIRTUAL_ENV="$PWD/.venv" \
            PATH="$PWD/.venv/bin:$PATH" \
            .venv/bin/maturin develop --release \
            --manifest-path crates/fcmaes-py/Cargo.toml
          .venv/bin/python -m pytest crates/fcmaes-py/python_tests examples/python
      - name: fcmaes-core API documentation coverage
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p fcmaes-core --no-deps
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  foundations:
    name: Foundations suites and lessons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: foundations
      - name: cargo fmt
        run: cargo fmt --manifest-path foundations/Cargo.toml --all -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path foundations/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path foundations/Cargo.toml --all-targets --all-features --locked
      - name: Foundations API documentation
        run: >-
          env RUSTDOCFLAGS="-D warnings"
          cargo doc --manifest-path foundations/Cargo.toml
          --all-features --no-deps --locked
      - name: Check dependency licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: foundations/Cargo.toml
          command: check
      - name: Run the smoke campaign
        run: >-
          cargo run --release --locked
          --manifest-path foundations/Cargo.toml --
          --campaign --preset smoke --workers 2 --seed 42
          --output /tmp/fcmaes-foundations-smoke
      - name: Run the Lennard-Jones smoke campaign
        run: >-
          cargo run --release --locked
          --manifest-path foundations/Cargo.toml
          --features gradient-reference --
          --lj-campaign --preset smoke --workers 2 --seed 42
          --output /tmp/fcmaes-foundations-lj-smoke

  optimizer-boundary:
    name: Optimizer-boundary evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/optimizer-boundary
      - name: cargo fmt
        run: >-
          cargo fmt --manifest-path benchmarks/optimizer-boundary/Cargo.toml
          --all -- --check
      - name: cargo clippy
        run: >-
          cargo clippy --release --locked --all-targets
          --manifest-path benchmarks/optimizer-boundary/Cargo.toml -- -D warnings
      - name: cargo test
        run: >-
          cargo test --release --locked
          --manifest-path benchmarks/optimizer-boundary/Cargo.toml
      - name: Re-render checked-in decision evidence
        run: |
          python benchmarks/optimizer-boundary/analyze.py \
            --results benchmarks/optimizer-boundary/results/decision-v2 \
            --output /tmp/optimizer-boundary-comparison.md
          diff -u \
            benchmarks/optimizer-boundary/results/decision-v2/comparison.md \
            /tmp/optimizer-boundary-comparison.md

  simulator-tutorials:
    name: Tutorial · ${{ matrix.tutorial }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tutorial:
          - nexosim-production-line
          - rapier-trebuchet
          - rebop-oscillator
          - oscillator-topology-search
          - brahe-constellation
          - rustpower-voltage-control
          - dispersion-source-localization
          - cfd-room-ventilation
          - ml-hyperparameter-tuning
          - neural-controller-policy-search
          - gtoc1
          - gtoc1-route-search
          - sindr-circuit-design
          - thevenin-gate-driver
          - optical-lens-design
          - rapier-quadruped-gait
          - phased-array-codebook
          - energy-hub-bilevel
          - field-service-routing
          - water-network-scheduling
          - truss-sizing
          - network-coverage
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tutorials/${{ matrix.tutorial }}
      - name: cargo fmt
        run: cargo fmt --manifest-path tutorials/${{ matrix.tutorial }}/Cargo.toml --all -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path tutorials/${{ matrix.tutorial }}/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path tutorials/${{ matrix.tutorial }}/Cargo.toml
      - name: Check field-service API documentation coverage
        if: matrix.tutorial == 'field-service-routing'
        run: >-
          env RUSTDOCFLAGS="-D warnings"
          cargo doc --manifest-path tutorials/field-service-routing/Cargo.toml
          --no-deps
      - name: Check water-network API documentation
        if: matrix.tutorial == 'water-network-scheduling'
        run: >-
          env RUSTDOCFLAGS="-D warnings"
          cargo doc --manifest-path tutorials/water-network-scheduling/Cargo.toml
          --no-deps
      - name: Check phased-array FFT feature
        if: matrix.tutorial == 'phased-array-codebook'
        run: |
          cargo clippy --manifest-path tutorials/phased-array-codebook/Cargo.toml \
            --all-targets --features fft -- -D warnings
          cargo test --manifest-path tutorials/phased-array-codebook/Cargo.toml \
            --features fft
      - name: Check phased-array API documentation
        if: matrix.tutorial == 'phased-array-codebook'
        run: >-
          env RUSTDOCFLAGS="-D warnings -D missing_docs"
          cargo doc --manifest-path tutorials/phased-array-codebook/Cargo.toml
          --no-deps --document-private-items
      - name: Check truss-sizing API documentation
        if: matrix.tutorial == 'truss-sizing'
        run: >-
          env RUSTDOCFLAGS="-D warnings -D missing_docs"
          cargo doc --manifest-path tutorials/truss-sizing/Cargo.toml
          --no-deps
      - name: Check network-coverage API documentation
        if: matrix.tutorial == 'network-coverage'
        run: >-
          env RUSTDOCFLAGS="-D warnings -D missing_docs"
          cargo doc --manifest-path tutorials/network-coverage/Cargo.toml
          --no-deps
      - name: Check oscillator topology-search API documentation
        if: matrix.tutorial == 'oscillator-topology-search'
        run: >-
          env RUSTDOCFLAGS="-D warnings"
          cargo doc --manifest-path tutorials/oscillator-topology-search/Cargo.toml
          --no-deps
      - name: Run HPO protocol smoke test
        if: matrix.tutorial == 'ml-hyperparameter-tuning'
        run: >-
          cargo run --release
          --manifest-path tutorials/ml-hyperparameter-tuning/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run circuit-design protocol smoke test
        if: matrix.tutorial == 'sindr-circuit-design'
        run: >-
          cargo run --release
          --manifest-path tutorials/sindr-circuit-design/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run transient gate-driver protocol smoke test
        if: matrix.tutorial == 'thevenin-gate-driver'
        run: >-
          cargo run --release
          --manifest-path tutorials/thevenin-gate-driver/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run optical-design protocol smoke test
        if: matrix.tutorial == 'optical-lens-design'
        run: >-
          cargo run --release
          --manifest-path tutorials/optical-lens-design/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run quadruped-gait protocol smoke test
        if: matrix.tutorial == 'rapier-quadruped-gait'
        run: >-
          cargo run --release
          --manifest-path tutorials/rapier-quadruped-gait/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run phased-array protocol smoke test
        if: matrix.tutorial == 'phased-array-codebook'
        run: >-
          cargo run --release --locked
          --manifest-path tutorials/phased-array-codebook/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run energy-hub protocol smoke test
        if: matrix.tutorial == 'energy-hub-bilevel'
        run: >-
          cargo run --release --locked
          --manifest-path tutorials/energy-hub-bilevel/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run field-service protocol smoke test
        if: matrix.tutorial == 'field-service-routing'
        run: >-
          cargo run --release --locked
          --manifest-path tutorials/field-service-routing/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run water-network protocol smoke test
        if: matrix.tutorial == 'water-network-scheduling'
        run: >-
          cargo run --release --locked
          --manifest-path tutorials/water-network-scheduling/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run truss-sizing protocol smoke test
        if: matrix.tutorial == 'truss-sizing'
        run: >-
          cargo run --release --locked
          --manifest-path tutorials/truss-sizing/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run network-coverage protocol smoke test
        if: matrix.tutorial == 'network-coverage'
        run: >-
          cargo run --release --locked
          --manifest-path tutorials/network-coverage/Cargo.toml --
          --preset smoke --mode all --workers 2 --seed 42 --no-output
      - name: Run oscillator topology-search protocol smoke test
        if: matrix.tutorial == 'oscillator-topology-search'
        working-directory: tutorials/oscillator-topology-search
        run: |
          python3 -m unittest agents/test_llm_agent.py
          cargo run --release --locked \
            --manifest-path Cargo.toml -- \
            --mode all --preset smoke --seed 42 \
            --agent-command 'python3 agents/mock_agent.py' \
            --output /tmp/oscillator-topology-search-ci
      - name: Run GTOC1 route-search protocol smoke test
        if: matrix.tutorial == 'gtoc1-route-search'
        run: >-
          cargo run --release --locked
          --manifest-path tutorials/gtoc1-route-search/Cargo.toml --
          --smoke --strategy agent
          --agent-command-json '["python3","tutorials/gtoc1-route-search/agents/mock_agent.py"]'
          --results tutorials/gtoc1-route-search/results/ci-smoke/agent
      - name: Check GTOC1 route-search evidence and figures
        if: matrix.tutorial == 'gtoc1-route-search'
        working-directory: tutorials/gtoc1-route-search
        run: |
          python3 -m unittest agents/test_llm_agent.py
          python3 compare_campaigns.py --check
          python3 plot_results.py --check
          python3 compare_campaigns.py \
            --results results/live-l0-seed42 --check
          python3 plot_results.py \
            --results results/live-l0-seed42 \
            --output images/live-l0-seed42 --check
          python3 summarize_promotions.py --check

  tutorial-artifacts:
    name: Tutorial artifacts and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting package
        working-directory: tutorials/python
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Test plotting API
        working-directory: tutorials/python
        run: python -m pytest
      - name: Check generated figures
        working-directory: tutorials/python
        run: python render_all.py --check
      - name: Check foundations publication figures
        working-directory: foundations
        run: python plot_results.py --check
      - name: Check local documentation links
        working-directory: tutorials/python
        run: python check_docs.py
