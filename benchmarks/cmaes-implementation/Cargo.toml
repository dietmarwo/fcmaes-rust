[package]
name = "cmaes-implementation-comparison"
version = "0.1.0"
edition = "2024"
publish = false
description = "Controlled active-CMA-ES implementation diagnostic"

[workspace]

[dependencies]
cmaes = { version = "=0.2.2", default-features = false }
cpu-time = "1.0"
csv = "1.3"
fcmaes-core = { path = "../../crates/fcmaes-core" }
fcmaes-gtop = { path = "../../crates/fcmaes-gtop" }
num_cpus = "1.16"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
