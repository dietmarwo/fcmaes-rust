[package]
name = "gtop-cmaes-retry"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Controlled GTOP study of serial CMA-ES and fcmaes parallel retry"

[workspace]

[dependencies]
cmaes = { version = "=0.2.2", default-features = false }
cpu-time = "1.0"
csv = "1.3"
fcmaes-core = { path = "../../crates/fcmaes-core" }
fcmaes-examples = { path = "../../examples" }
num_cpus = "1.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
