[workspace]
resolver = "2"
members = [
    "crates/optimization-job-api",
    "crates/optimization-runner",
    "crates/fcmaes-job-worker",
    "crates/fcmaes-core",
    "crates/fcmaes-gtop",
    "crates/fcmaes-py",
    "examples",
    "crates/fcmaes-job-api",
    "crates/fcmaes-runner",
    "crates/fcmaes-native-worker",
]

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Dietmar Wolz"]
repository = "https://github.com/dietmarwo/fcmaes-rust"

[workspace.dependencies]
fcmaes-core = { path = "crates/fcmaes-core" }
fcmaes-gtop = { path = "crates/fcmaes-gtop" }

# The runner and its workers hash their staged executables (tens of MB in
# debug builds) on every job start; unoptimized SHA-256 made debug start-up
# take seconds. Optimize just the hashing crate in dev and test builds.
[profile.dev.package.sha2]
opt-level = 3
