[workspace]
resolver = "2"
members = [
    "crates/fcmaes-surrogate",
    "crates/fcmaes-job-worker",
    "crates/fcmaes-core",
    "crates/fcmaes-gtop",
    "crates/fcmaes-py",
    "examples",
    "crates/fcmaes-runner",
    "crates/fcmaes-native-worker",
]

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Dietmar Wolz"]
repository = "https://github.com/dietmarwo/fcmaes-rust"

[workspace.dependencies]
fcmaes-surrogate = { path = "crates/fcmaes-surrogate" }
fcmaes-core = { path = "crates/fcmaes-core" }
fcmaes-gtop = { path = "crates/fcmaes-gtop" }
# The shared job API (envelope, result contract, worker SDK, runner) lives in
# github.com/dietmarwo/optimization-jobs; change the revision there first.
optimization-job-api = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "eb1c9de66e677097a7ea22d9a4b2f6357c18751d" }
optimization-runner = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "eb1c9de66e677097a7ea22d9a4b2f6357c18751d" }

# The runner and its workers hash their staged executables (tens of MB in
# debug builds) on every job start; unoptimized SHA-256 made debug start-up
# take seconds. Optimize just the hashing crate in dev and test builds.
[profile.dev.package.sha2]
opt-level = 3
