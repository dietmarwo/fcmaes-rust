[package]
name = "truss-sizing"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Discrete truss topology and section-sizing tutorial using fcmaes-core"

# Standalone tutorial workspace: keep tutorial dependencies out of the root workspace.
[workspace]

[dependencies]
fcmaes-core = "=0.1.3"
# Local development override:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
nalgebra = "=0.33.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
