[package]
default-run = "rapier-trebuchet"
name = "rapier-trebuchet"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental fcmaes-rust optimization of a Rapier 2D trebuchet"

# Standalone tutorial workspace: keep simulator dependencies out of the root workspace.
[workspace]

[dependencies]
optimization-job-api = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "4f93d75ba9dc0ca40d6de455261b7a753f130976", optional = true }
fcmaes-job-worker = { path = "../../crates/fcmaes-job-worker", optional = true }
fcmaes-core = { path = "../../crates/fcmaes-core" }
rapier2d-f64 = { version = "0.34.0", default-features = false, features = [
    "dim2",
    "f64",
    "std",
    "enhanced-determinism",
] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"

[features]
job-worker = ["dep:fcmaes-job-worker", "dep:optimization-job-api"]

[[bin]]
name = "trebuchet-job-worker"
path = "src/bin/job_worker.rs"
required-features = ["job-worker"]
