[package]
name = "sindr-circuit-design"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Circuit-design optimization tutorial using fcmaes-core and sindr"

# Standalone tutorial workspace: keep simulator dependencies out of the root workspace.
[workspace]

[dependencies]
fcmaes-core = "=0.1.3"
# For development against this checkout, replace the line above with:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
serde_json = "1"
sindr = "=0.1.0-alpha.6"

[profile.release]
codegen-units = 1
lto = "thin"
