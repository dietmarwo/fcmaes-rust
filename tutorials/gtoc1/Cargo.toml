[package]
name = "gtoc1"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Reproducible Rust optimization of the real GTOC1 EVEEEJSJA trajectory"

# Standalone tutorial workspace: pykep stays outside the main fcmaes workspace.
[workspace]

[dependencies]
fcmaes-core = { path = "../../crates/fcmaes-core" }
