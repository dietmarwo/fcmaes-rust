[package]
default-run = "nexosim-production-line"
name = "nexosim-production-line"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental fcmaes-rust MODE optimization of a NeXosim production-line digital twin"

# Standalone tutorial workspace: keep simulator dependencies out of the root workspace.
[workspace]

[dependencies]
optimization-job-api = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "602d31afacf8bd2ecb0b0e941d18bd8e2821c1e3", optional = true }
fcmaes-job-worker = { path = "../../crates/fcmaes-job-worker", optional = true }
fcmaes-core = { path = "../../crates/fcmaes-core" }
nexosim = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"

[features]
job-worker = ["dep:fcmaes-job-worker", "dep:optimization-job-api"]

[[bin]]
name = "production-job-worker"
path = "src/bin/job_worker.rs"
required-features = ["job-worker"]
