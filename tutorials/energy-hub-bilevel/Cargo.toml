[package]
default-run = "energy-hub-bilevel"
name = "energy-hub-bilevel"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Bilevel energy-hub sizing with a pure-Rust inner LP"

[workspace]

[dependencies]
optimization-job-api = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "2351e40842d228d98880282a7788eb195c74d718", optional = true }
fcmaes-job-worker = { path = "../../crates/fcmaes-job-worker", optional = true }
fcmaes-core = "=0.1.3"
# For development against this checkout, replace the line above with:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
microlp = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"

[features]
job-worker = ["dep:fcmaes-job-worker", "dep:optimization-job-api"]

[[bin]]
name = "energy-job-worker"
path = "src/bin/job_worker.rs"
required-features = ["job-worker"]
