[package]
name = "network-coverage"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Weighted graph and group coverage tutorial using fcmaes-core"

[workspace]

[dependencies]
fcmaes-core = "=0.1.3"
# Local development override:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
microlp = "=0.6.0"
petgraph = "=0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
