[graph]
all-features = true

[advisories]
# `paste` is unmaintained, but both pinned upstream libraries currently pull it
# transitively and the advisory has no safe upgrade. See DEPENDENCY_NOTICE.md.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { name = "paris", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
