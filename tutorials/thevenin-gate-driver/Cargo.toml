[package]
name = "thevenin-gate-driver"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Transient gate-driver optimization tutorial using fcmaes-core and thevenin"

# Standalone tutorial workspace: keep simulator dependencies out of the root workspace.
[workspace]

[dependencies]
fcmaes-core = "=0.1.3"
# For development against this checkout, replace the line above with:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
serde_json = "1"
thevenin-cirq = "=0.5.0"
thevenin-types = "=0.5.0"

[profile.release]
codegen-units = 1
lto = "thin"
