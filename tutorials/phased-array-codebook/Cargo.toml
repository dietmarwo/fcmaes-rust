[package]
name = "phased-array-codebook"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Quantized phased-array synthesis tutorial using fcmaes-core"

# Standalone tutorial workspace: keep tutorial dependencies out of the root workspace.
[workspace]

[dependencies]
fcmaes-core = "=0.1.3"
# For development against this checkout, replace the line above with:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
num-complex = "=0.4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.rustfft]
version = "=6.4.1"
optional = true

[features]
default = []
fft = ["dep:rustfft"]

[profile.release]
codegen-units = 1
lto = "thin"
