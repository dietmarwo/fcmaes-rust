[package]
name = "oscillator-topology-search"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Split-brain stochastic oscillator topology search with ReBop and fcmaes-core"

[workspace]

[dependencies]
fcmaes-core = "=0.1.3"
# Local development override:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
# Reduced local compatibility implementation targeting ReBop 0.9.7. See
# DEPENDENCY_NOTICE.md for the intentionally narrower API and numerical deltas.
rebop = { path = "vendor/rebop", version = "=0.9.7" }
num_cpus = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A distinct registry source lets the compatibility test run the same sparse
# mass-action network through upstream and the local implementation.
rebop-upstream = { package = "rebop", version = "=0.9.7" }

[profile.release]
codegen-units = 1
lto = "thin"
