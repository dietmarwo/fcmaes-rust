[package]
name = "rustpower-voltage-control"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental robust voltage-control optimization with RustPower and fcmaes-rust"

# Standalone tutorial workspace: keep simulator dependencies out of the root workspace.
[workspace]

[dependencies]
bevy_ecs = "0.19"
fcmaes-core = { path = "../../crates/fcmaes-core" }
rustpower = { version = "0.5.0", default-features = false, features = ["archive", "rsparse"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
