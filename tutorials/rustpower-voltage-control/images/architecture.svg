<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Robust voltage-control optimization architecture</title>
  <desc id="desc">A mixed control design is cloned into six IEEE-39 scenarios. Serial AC power flows produce four objectives and three constraints for constrained MODE.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#355c7d"/></marker><style>.b{fill:#f5f8fb;stroke:#355c7d;stroke-width:2}.g{fill:#e4f4ef;stroke:#16817a;stroke-width:2}.r{fill:#fff0ec;stroke:#c65d45;stroke-width:2}.t{font:700 18px system-ui;fill:#17324d}.s{font:13px system-ui;fill:#526779}.l{stroke:#355c7d;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <text class="t" x="35" y="34">Mixed-integer robust voltage-control design</text>
  <rect class="b" x="35" y="72" width="205" height="112" rx="12"/><text class="t" x="137" y="104" text-anchor="middle">20 controls</text><text class="s" x="137" y="130" text-anchor="middle">generator V · integer taps</text><text class="s" x="137" y="151" text-anchor="middle">capacitors · battery</text><text class="s" x="137" y="172" text-anchor="middle">renewable curtailment</text>
  <rect class="g" x="300" y="52" width="250" height="152" rx="12"/><text class="t" x="425" y="83" text-anchor="middle">Six cloned IEEE-39 grids</text><text class="s" x="425" y="110" text-anchor="middle">base · evening peak · renewable</text><text class="s" x="425" y="132" text-anchor="middle">hot peak · N−1 line · trip</text><text class="s" x="425" y="166" text-anchor="middle">serial RSparse Newton solves</text><text class="s" x="425" y="187" text-anchor="middle">parallel across candidates</text>
  <rect class="b" x="610" y="52" width="215" height="152" rx="12"/><text class="t" x="717" y="83" text-anchor="middle">Audited outputs</text><text class="s" x="717" y="110" text-anchor="middle">loss · voltage · cost</text><text class="s" x="717" y="132" text-anchor="middle">security · convergence</text><text class="s" x="717" y="166" text-anchor="middle">voltage / thermal / PF</text><text class="s" x="717" y="187" text-anchor="middle">constraints ≤ 0</text>
  <rect class="g" x="885" y="72" width="200" height="112" rx="12"/><text class="t" x="985" y="107" text-anchor="middle">Constrained MODE</text><text class="s" x="985" y="135" text-anchor="middle">feasible Pareto front</text><text class="s" x="985" y="158" text-anchor="middle">four objectives retained</text>
  <path class="l" d="M240 128H300"/><path class="l" d="M550 128H610"/><path class="l" d="M825 128H885"/>
  <rect class="r" x="150" y="285" width="820" height="105" rx="12"/><text class="t" x="560" y="319" text-anchor="middle">QD go/no-go pilot: not promoted to a publication formulation</text><text class="s" x="560" y="347" text-anchor="middle">100,097 evaluations → 16/400 niches; battery capacity 269.9–274.2 MW; one battery-bus category</text><text class="s" x="560" y="371" text-anchor="middle">Capacitor support varied, but the proposed descriptor pair did not expose useful architectural diversity.</text>
</svg>
