<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Constellation access optimization architecture</title>
  <desc id="desc">Four satellite orbits are propagated against six ground stations. Access windows feed constrained MODE and an altitude-plane-spread MAP-Elites archive.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#355c7d"/></marker><style>.b{fill:#f5f8fb;stroke:#355c7d;stroke-width:2}.g{fill:#e4f4ef;stroke:#16817a;stroke-width:2}.t{font:700 18px system-ui;fill:#17324d}.s{font:13px system-ui;fill:#526779}.l{stroke:#355c7d;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <text class="t" x="35" y="34">Four-satellite architecture to station contact portfolio</text>
  <rect class="b" x="35" y="72" width="205" height="100" rx="12"/><text class="t" x="137" y="105" text-anchor="middle">10 orbit variables</text><text class="s" x="137" y="132" text-anchor="middle">altitude · inclination</text><text class="s" x="137" y="153" text-anchor="middle">4 RAAN · 4 anomaly</text>
  <rect class="g" x="300" y="62" width="220" height="120" rx="12"/><text class="t" x="410" y="98" text-anchor="middle">Brahe propagation</text><ellipse cx="410" cy="137" rx="65" ry="22" fill="none" stroke="#16817a" stroke-width="2"/><circle cx="410" cy="137" r="13" fill="#355c7d"/><circle cx="472" cy="131" r="5" fill="#f39c5a"/>
  <rect class="b" x="580" y="72" width="210" height="100" rx="12"/><text class="t" x="685" y="105" text-anchor="middle">Access windows</text><text class="s" x="685" y="132" text-anchor="middle">6 stations × 4 satellites</text><text class="s" x="685" y="153" text-anchor="middle">merge · filter · aggregate</text>
  <rect class="b" x="850" y="48" width="235" height="66" rx="12"/><text class="t" x="967" y="78" text-anchor="middle">Constrained MODE</text><text class="s" x="967" y="99" text-anchor="middle">gap · contact · launch cost</text>
  <rect class="b" x="850" y="135" width="235" height="66" rx="12"/><text class="t" x="967" y="165" text-anchor="middle">MAP-Elites</text><text class="s" x="967" y="186" text-anchor="middle">altitude × plane spread</text>
  <path class="l" d="M240 122H300"/><path class="l" d="M520 122H580"/><path class="l" d="M790 102L850 81"/><path class="l" d="M790 145L850 168"/>
  <text class="t" x="35" y="264">One worker-pool owner</text>
  <rect class="g" x="35" y="295" width="500" height="105" rx="12"/><text class="t" x="285" y="330" text-anchor="middle">Outer mode · used for optimization</text><text class="s" x="285" y="358" text-anchor="middle">24 fcmaes candidate workers · serial Brahe access</text><text class="s" x="285" y="380" text-anchor="middle">ordered archive/population updates</text>
  <rect class="b" x="585" y="295" width="500" height="105" rx="12"/><text class="t" x="835" y="330" text-anchor="middle">Inner mode · benchmark alternative</text><text class="s" x="835" y="358" text-anchor="middle">one optimizer evaluation · Brahe owns 24 access threads</text><text class="s" x="835" y="380" text-anchor="middle">never stack both pools</text>
</svg>
