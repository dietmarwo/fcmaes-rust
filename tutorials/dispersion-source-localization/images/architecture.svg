<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-family: sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .small { font-family: sans-serif; font-size: 13px; fill: #334155; }
      .box { stroke: #334155; stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="520" fill="#f8fafc"/>
  <text x="560" y="38" text-anchor="middle" class="title">Native dispersion inverse-problem pipeline</text>

  <rect x="35" y="85" width="205" height="112" class="box" fill="#dbeafe"/>
  <text x="138" y="118" text-anchor="middle" class="label">Training observations</text>
  <text x="138" y="145" text-anchor="middle" class="small">16 sensors × 16 weather</text>
  <text x="138" y="168" text-anchor="middle" class="small">noise, censoring, model mismatch</text>

  <rect x="300" y="85" width="220" height="112" class="box" fill="#dcfce7"/>
  <text x="410" y="116" text-anchor="middle" class="label">Candidate decode</text>
  <text x="410" y="143" text-anchor="middle" class="small">2 sources + 4 correction terms</text>
  <text x="410" y="166" text-anchor="middle" class="small">canonicalize interchangeable sources</text>

  <rect x="580" y="85" width="230" height="112" class="box" fill="#fef3c7"/>
  <text x="695" y="116" text-anchor="middle" class="label">Native receptor model</text>
  <text x="695" y="143" text-anchor="middle" class="small">Gaussian spread + plume rise</text>
  <text x="695" y="166" text-anchor="middle" class="small">serial, deterministic Rust evaluation</text>

  <rect x="870" y="85" width="215" height="112" class="box" fill="#fce7f3"/>
  <text x="978" y="116" text-anchor="middle" class="label">Robust metrics</text>
  <text x="978" y="143" text-anchor="middle" class="small">Huber + p95 + detections</text>
  <text x="978" y="166" text-anchor="middle" class="small">emission and centroid descriptors</text>

  <path d="M240 141 H291" class="arrow"/>
  <path d="M520 141 H571" class="arrow"/>
  <path d="M810 141 H861" class="arrow"/>

  <rect x="95" y="272" width="245" height="105" class="box" fill="#e0e7ff"/>
  <text x="218" y="304" text-anchor="middle" class="label">BiteOpt advanced retry</text>
  <text x="218" y="331" text-anchor="middle" class="small">one robust source estimate</text>
  <text x="218" y="354" text-anchor="middle" class="small">parallel independent retries</text>

  <rect x="438" y="272" width="245" height="105" class="box" fill="#ede9fe"/>
  <text x="560" y="304" text-anchor="middle" class="label">MODE</text>
  <text x="560" y="331" text-anchor="middle" class="small">error / tail / emission Pareto front</text>
  <text x="560" y="354" text-anchor="middle" class="small">parallel ask/tell population</text>

  <rect x="780" y="272" width="245" height="105" class="box" fill="#cffafe"/>
  <text x="903" y="304" text-anchor="middle" class="label">MAP-Elites</text>
  <text x="903" y="331" text-anchor="middle" class="small">source-centroid hypothesis map</text>
  <text x="903" y="354" text-anchor="middle" class="small">parallel candidate chunks</text>

  <path d="M978 197 V230 H218 V263" class="arrow"/>
  <path d="M978 197 V230 H560 V263" class="arrow"/>
  <path d="M978 197 V230 H903 V263" class="arrow"/>

  <rect x="300" y="430" width="520" height="62" class="box" fill="#fee2e2"/>
  <text x="560" y="457" text-anchor="middle" class="label">Disjoint holdout validation</text>
  <text x="560" y="480" text-anchor="middle" class="small">10 unseen sensors × 10 unseen weather records; never optimized</text>
  <path d="M218 377 V407 H560 V421" class="arrow"/>
  <path d="M560 377 V421" class="arrow"/>
  <path d="M903 377 V407 H560 V421" class="arrow"/>
</svg>
