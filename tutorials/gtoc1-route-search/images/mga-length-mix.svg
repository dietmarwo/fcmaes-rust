  <rect x="160.00" y="339" width="118.40" height="38" fill="#9ecae1" stroke="#f7f9fc" stroke-width="1"/>
  <text x="219.20" y="365" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#132238">16</text>
