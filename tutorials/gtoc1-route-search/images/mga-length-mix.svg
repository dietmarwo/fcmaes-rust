  <rect x="570" y="438" width="22" height="16" fill="#f3ba63"/>
  <text x="600" y="452" font-family="system-ui" font-size="14" fill="#26384f">10–11 encounters</text>
  <rect x="760" y="438" width="22" height="16" fill="#d66b6b"/>
  <text x="790" y="452" font-family="system-ui" font-size="14" fill="#26384f">12–14 encounters</text>
  <text x="530" y="493" text-anchor="middle" font-family="system-ui" font-size="14" fill="#40556f">Each bar contains 100 accepted, unique body orders</text>
