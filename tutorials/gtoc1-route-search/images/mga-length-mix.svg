  <rect x="389.40" y="105" width="296.00" height="38" fill="#56b4a9" stroke="#f7f9fc" stroke-width="1"/>
  <text x="537.40" y="131" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#132238">40</text>
  <rect x="685.40" y="105" width="103.60" height="38" fill="#f3ba63" stroke="#f7f9fc" stroke-width="1"/>
  <text x="737.20" y="131" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#132238">14</text>
