  <text x="22" y="210" font-family="system-ui" font-size="15" fill="#26384f">evolutionary</text>
  <rect x="160.00" y="183" width="74.00" height="38" fill="#9ecae1" stroke="#f7f9fc" stroke-width="1"/>
  <text x="197.00" y="209" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#132238">10</text>
  <rect x="234.00" y="183" width="347.80" height="38" fill="#56b4a9" stroke="#f7f9fc" stroke-width="1"/>
  <text x="407.90" y="209" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#132238">47</text>
