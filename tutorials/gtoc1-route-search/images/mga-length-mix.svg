<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">MGA route-length distribution</title>
  <desc id="desc">Encounter-count bands for 100 accepted routes per strategy. Cold Gemma concentrates in the longest band while the assisted policy concentrates in the 7–9 encounter band.</desc>
