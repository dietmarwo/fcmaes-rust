  <text x="859.30" y="209" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#132238">11</text>
  <text x="22" y="288" font-family="system-ui" font-size="15" fill="#26384f">cold Gemma</text>
  <rect x="160.00" y="261" width="0.00" height="38" fill="#9ecae1" stroke="#f7f9fc" stroke-width="1"/>
  <rect x="160.00" y="261" width="7.40" height="38" fill="#56b4a9" stroke="#f7f9fc" stroke-width="1"/>
  <rect x="167.40" y="261" width="22.20" height="38" fill="#f3ba63" stroke="#f7f9fc" stroke-width="1"/>
