<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Split-brain MGA route-discovery architecture</title>
  <desc id="desc">Random, evolutionary, or Gemma proposes a planet order. Rust derives directions, rejects duplicates, optimizes timing, evaluates MGA physics, and updates a top-N archive.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#40556f"/></marker>
    <style>
      .box{rx:14;stroke-width:2}.title{font:700 19px system-ui,sans-serif;fill:#132238}.body{font:15px system-ui,sans-serif;fill:#26384f}.small{font:13px system-ui,sans-serif;fill:#40556f}.edge{stroke:#40556f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="540" fill="#f7f9fc"/>
  <text class="title" x="560" y="38" text-anchor="middle">One matched outer protocol, three proposal policies</text>
  <rect class="box" x="35" y="80" width="250" height="175" fill="#fff3d6" stroke="#c99118"/>
  <text class="title" x="160" y="116" text-anchor="middle">Discrete proposer</text>
  <text class="body" x="160" y="153" text-anchor="middle">random · evolutionary</text>
  <text class="body" x="160" y="180" text-anchor="middle">Gemma 4 / llama.cpp</text>
  <text class="small" x="160" y="214" text-anchor="middle">body order + rationale only</text>
  <text class="small" x="160" y="237" text-anchor="middle">rationale is untrusted</text>
  <rect class="box" x="350" y="65" width="330" height="210" fill="#e7f2ff" stroke="#2774ae"/>
  <text class="title" x="515" y="103" text-anchor="middle">Deterministic Rust owner</text>
  <text class="body" x="382" y="140">1. grammar + canonical directions</text>
  <text class="body" x="382" y="170">2. duplicate + diversity gates</text>
  <text class="body" x="382" y="200">3. equal-budget DE–CMA-ES</text>
  <text class="body" x="382" y="230">4. multi-revolution MGA score</text>
  <text class="small" x="515" y="257" text-anchor="middle">physical cores by default</text>
  <rect class="box" x="750" y="80" width="330" height="175" fill="#e8f7ed" stroke="#2f855a"/>
  <text class="title" x="915" y="116" text-anchor="middle">Evidence archive</text>
  <text class="body" x="780" y="153">checksummed JSONL + atomic cache</text>
  <text class="body" x="780" y="183">scores, failures, budgets, tokens</text>
  <text class="body" x="780" y="213">best-20 portfolio sum</text>
  <text class="small" x="915" y="238" text-anchor="middle">MGA-qualified ≠ low-thrust feasible</text>
  <path class="edge" d="M285 170 H342"/>
  <path class="edge" d="M680 170 H742"/>
  <path class="edge" d="M915 263 C915 335 160 335 160 263"/>
  <text class="small" x="535" y="322" text-anchor="middle">bounded observations; unseen candidates only</text>
  <rect class="box" x="180" y="375" width="760" height="115" fill="#f0eaff" stroke="#7656b5"/>
  <text class="title" x="560" y="413" text-anchor="middle">Separate downstream project</text>
  <text class="body" x="560" y="447" text-anchor="middle">MGA portfolio → low-thrust transcription → Taylor + DOP853 validation</text>
  <text class="small" x="560" y="474" text-anchor="middle">outside this proposer comparison and outside its score claims</text>
  <path class="edge" d="M915 255 C915 350 830 350 830 367"/>
</svg>
