<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Route-search constraint convergence</title>
  <desc id="desc">Lowest feasibility-first L0 constraint violation by accepted candidate for three protocol-fixture arms.</desc>
  <rect width="1000" height="520" fill="#f7f9fc"/>
  <text x="500" y="42" text-anchor="middle" font-family="system-ui" font-size="24" font-weight="700" fill="#132238">Lowest L0 constraint violation under the protocol budget</text>
  <path d="M90 450 H950 M90 450 V80" stroke="#40556f" stroke-width="2"/>
  <polyline points="90.00,450.00 520.00,450.00 950.00,450.00" fill="none" stroke="#2774ae" stroke-width="4"/>
  <polyline points="90.00,100.00 520.00,100.00 950.00,100.00" fill="none" stroke="#c99118" stroke-width="4"/>
  <polyline points="90.00,100.00 520.00,100.00 950.00,100.00" fill="none" stroke="#7656b5" stroke-width="4"/>
  <rect x="260" y="475" width="24" height="5" fill="#2774ae"/><text x="294" y="484" font-family="system-ui" font-size="15" fill="#26384f">agent</text>
  <rect x="490" y="475" width="24" height="5" fill="#c99118"/><text x="524" y="484" font-family="system-ui" font-size="15" fill="#26384f">random</text>
  <rect x="720" y="475" width="24" height="5" fill="#7656b5"/><text x="754" y="484" font-family="system-ui" font-size="15" fill="#26384f">evolutionary</text>
  <text x="520" y="510" text-anchor="middle" font-family="system-ui" font-size="14" fill="#40556f">accepted candidates</text>
  <text x="24" y="270" text-anchor="middle" font-family="system-ui" font-size="13" fill="#40556f" transform="rotate(-90 24 270)">log10(1 + violation), lower is better</text>
</svg>
