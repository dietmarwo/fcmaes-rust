[package]
default-run = "gtoc1-route-search"
name = "gtoc1-route-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Split-brain GTOC1 route proposal with equal-budget Rust evaluation"

[workspace]

[lib]
name = "gtoc1_pykep"

[dependencies]
fcmaes-job-worker = { path = "../../crates/fcmaes-job-worker", optional = true }
# Durable JSONL, snapshot, checksum and subprocess helpers; the same
# revision as the repository's root Cargo.toml.
optimization-job-api = { git = "https://github.com/dietmarwo/optimization-jobs", rev = "466a373ff81815493451063a9885db28c1946504", version = "0.3" }
fcmaes-core = "=0.1.3"
# Repository development alternative:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
pykep-core = "=0.1.4"
num_cpus = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"

[features]
job-worker = ["dep:fcmaes-job-worker"]

[[bin]]
name = "gtoc1-job-worker"
path = "src/bin/job_worker.rs"
required-features = ["job-worker"]

[[bin]]
name = "gtoc1-route-card"
path = "src/bin/route_card.rs"
required-features = ["job-worker"]
