[package]
name = "gtoc1-route-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Split-brain GTOC1 route proposal with equal-budget Rust evaluation"

[workspace]

[lib]
name = "gtoc1_pykep"

[dependencies]
fcmaes-core = "=0.1.3"
# Repository development alternative:
# fcmaes-core = { path = "../../crates/fcmaes-core" }
pykep-core = "=0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
