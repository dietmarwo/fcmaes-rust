[graph]
all-features = true

[advisories]
# `paste` is unmaintained, but both pinned numerical libraries currently pull
# it transitively and the advisory has no safe upgrade. See DEPENDENCY_NOTICE.md.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { name = "pykep-core", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared job API (optimization-job-api) at a pinned revision.
allow-git = ["https://github.com/dietmarwo/optimization-jobs"]
