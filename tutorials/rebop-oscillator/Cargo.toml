[package]
name = "rebop-oscillator"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental robust stochastic oscillator optimization with ReBop and fcmaes-rust"

# Standalone tutorial workspace: keep simulator dependencies out of the root workspace.
[workspace]

[dependencies]
fcmaes-core = { path = "../../crates/fcmaes-core" }
rebop = "0.9.7"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
