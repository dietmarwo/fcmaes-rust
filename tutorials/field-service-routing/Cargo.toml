[package]
name = "field-service-routing"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Random-key field-service routing with robust, multi-objective and QD formulations"
default-run = "field-service-routing"

[workspace]

[dependencies]
fcmaes-core = "=0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
