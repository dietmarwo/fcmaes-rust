[advisories]
# `fcmaes-core` currently reaches archived `paste` through nalgebra/simba.
# The advisory has no safe upgrade; see DEPENDENCY_NOTICE.md.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
