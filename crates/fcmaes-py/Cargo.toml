[package]
name = "fcmaes-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PyO3 bindings for the fcmaes-rust Python distribution."
publish = false

[lib]
name = "_fcmaes_ext"
crate-type = ["cdylib"]
doc = false

[dependencies]
fcmaes-core = { workspace = true }
fcmaes-gtop = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
