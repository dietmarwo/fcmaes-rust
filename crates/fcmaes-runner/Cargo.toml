[package]
name = "fcmaes-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[[bin]]
name = "fcmaes-run"
path = "src/main.rs"
[dependencies]
fcmaes-job-api = { path = "../fcmaes-job-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
