[package]
name = "fcmaes-surrogate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic small-budget Gaussian-process optimization and synchronous batches"
publish = false

[dependencies]
fcmaes-core.workspace = true
nalgebra = "0.33"
libm = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
